on: workflow_dispatch
jobs: 
  download: 
        name: run
        runs-on: ubuntu-latest
        steps:
          - name: requied
            run: wget https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -O ~/.local/bin/yt-dlp
                 chmod a+rx ~/.local/bin/yt-dlp
          - name: download
            run: yt-dlp --version
        
