name: YouTubeVideoDownloader

on: workflow_dispatch
jobs: 
  download: 
        name: run
        runs-on: ubuntu-latest
        steps:
          - name: requied
            env: 
                 YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
            run: | 
                 #Install deno
                 curl -fsSL https://deno.land/install.sh | sh
                 deno --version
                 
                 #Install yt-dlp
                 mkdir -p ~/.local/bin
                 curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o ~/.local/bin/yt-dlp
                 chmod a+rx ~/.local/bin/yt-dlp
                 
                 #setup youtube cookies
                 mkdir -p /$GITHUB_WORKSPACE/yt-dlp-authinfo
                 printf '%s\n' "$YOUTUBE_COOKIES" > /$GITHUB_WORKSPACE/yt-dlp-authinfo/youtube-cookies.txt
                 
          - name: download
            run: | 
                 yt-dlp --update
                 yt-dlp --version
                 yt-dlp --verbose -P /$GITHUB_WORKSPACE/yt-dlp-savepoint/ -o "savevideo.%(ext)s" --cookies /$GITHUB_WORKSPACE/yt-dlp-authinfo/youtube-cookies.txt "https://www.youtube.com/watch?v=nZMCCcYayMc"
          - name: check
            run: | 
                yt-dlp --filepath
                rm -f /$GITHUB_WORKSPACE/yt-dlp-authinfo/youtube-cookies.txt
          - name: archive
            uses: actions/upload-artifact@v4
            with: 
                  name: archivefile
                  path: /$GITHUB_WORKSPACE/yt-dlp-savepoint/savevideo.mp4




