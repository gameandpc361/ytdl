name: YouTubeVideoDownloader

on: workflow_dispatch
jobs: 
  download: 
        name: run
        runs-on: ubuntu-latest
        steps:
          - name: requied
            env: 
                 YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
            run: | 
                 mkdir -p ~/.local/bin
                 curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o ~/.local/bin/yt-dlp
                 chmod a+rx ~/.local/bin/yt-dlp
                 mkdir -p /yt-dlp-authinfo
                 printf '%s\n' '$YOUTUBE_COOKIES' > /yt-dlp-authinfo/youtube-cookies.txt
                 
          - name: download
            run: | 
                 yt-dlp --update
                 yt-dlp --version
                 yt-dlp -P /yt-dlp-savepoint/ -o "savevideo.%(ext)s" --cookies /yt-dlp-authinfo/youtube-cookies.txt "https://www.youtube.com/watch?v=nZMCCcYayMc"
          - name: check
            run: | 
                yt-dlp --filepath
                rm -f /yt-dlp-authinfo/youtube-cookies.txt
          - name: archive
            uses: actions/upload-artifact@v4
            with: 
                  name: archivefile
                  path: /yt-dlp-savepoint/savevideo.mp4




