name: YouTubeVideoDownloader

on: 
 workflow_dispatch:
   inputs:
     URL: 
       description: 'YouTube Videos URL'
       type: string
       required: true
jobs: 
  download: 
        name: run
        runs-on: ubuntu-latest
        steps:
          - name: requied
            env: 
                 YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
            run: | 
                 #Install deno
                 curl -fsSL https://deno.land/install.sh | sh
                 echo "$HOME/.deno/bin" >> "$GITHUB_PATH"
                 
                 #Install yt-dlp
                 mkdir -p ~/.local/bin
                 curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o ~/.local/bin/yt-dlp
                 chmod a+rx ~/.local/bin/yt-dlp

                 #Install FFmpeg
                 sudo apt update
                 sudo apt -y install ffmpeg
                 
                 #setup youtube cookies
                 mkdir -p $GITHUB_WORKSPACE/yt-dlp-authinfo
                 printf '%s\n' "$YOUTUBE_COOKIES" > $GITHUB_WORKSPACE/yt-dlp-authinfo/youtube-cookies.txt
                 
          - name: download
            run: | 
                 ffmpeg -version
                 deno --version
                 yt-dlp --update
                 yt-dlp --version
                 yt-dlp --verbose -f "bv*+ba/b" -P $GITHUB_WORKSPACE/yt-dlp-savepoint/ -o "savevideo.%(ext)s" --cookies $GITHUB_WORKSPACE/yt-dlp-authinfo/youtube-cookies.txt "{{ github.event.input.URL }}"
          - name: after
            run: | 
                input=$(find "$GITHUB_WORKSPACE/yt-dlp-savepoint" -maxdepth 1 -type f -name 'savevideo.*' | head -n 1)
                ffmpeg -i "$input" \
                -c:v libx264 \
                -preset medium \
                -crf 18 \
                -c:a aac \
                -b:a 192k \
                -movflags +faststart \
                "$GITHUB_WORKSPACE/yt-dlp-savepoint/output_video.mp4"
                rm -f $GITHUB_WORKSPACE/yt-dlp-authinfo/youtube-cookies.txt
          - name: archive
            uses: actions/upload-artifact@v4
            with: 
                  name: archivefile
                  path: ${{ github.workspace }}/yt-dlp-savepoint/




